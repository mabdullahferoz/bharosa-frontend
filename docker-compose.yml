# Web app: Caddy serves the PWA, gets HTTPS certificates, and proxies /api to the API.
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production up -d --build
#
# Start the backend stack from the bharosa-api repo first: it creates the `bharosa`
# Docker network this service joins to reach the `api` container.
services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: ${API_UPSTREAM:-api:4000}
      API_ORIGIN: ${API_ORIGIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bharosa

networks:
  bharosa:
    external: true

volumes:
  caddy_data:
  caddy_config:
